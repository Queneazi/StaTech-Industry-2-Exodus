#Ore Scanner (debug item, creative or operators only): right-click to count ores around you
[ore_scanner]
	#How many chunks around the player to scan (4 = a 9x9 chunk square); only loaded chunks count
	# Default: 4
	# Range: 0 ~ 16
	radius = 4
	#Block tag of what to count, e.g. "c:ores" or "c:ores/nivalum"
	tag = "c:ores"
	#How many of the nearest ores glow after a scan (outlined through walls, in each ore's colour); 0 = none
	# Default: 128
	# Range: 0 ~ 2048
	highlights = 128
	#How long the highlights stay, in seconds (a new scan replaces them)
	# Default: 30
	# Range: 1 ~ 600
	highlight_seconds = 30
