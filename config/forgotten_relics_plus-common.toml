#通用配置（原版分类 Generic Config）
[generic]
	#Mining speed boost for Mining Charm. 1.0 means that it is boosted by 100%.
	#采矿护符的挖掘速度加成倍率。1.0 表示提升 100%。
	# Default: 1.0
	# Range: 0.0 ~ 32000.0
	miningCharmBoost = 1.0
	#Block reach increase for Mining Charm.
	#采矿护符增加的方块触及距离。
	# Default: 2.0
	# Range: 0.0 ~ 32.0
	miningCharmReach = 2.0
	#Mining speed boost for Ethereal Mining Charm. 3.0 means that it is boosted by 300%.
	#以太采矿护符的挖掘速度加成倍率。3.0 表示提升 300%。
	# Default: 3.0
	# Range: 0.0 ~ 32000.0
	advancedMiningCharmBoost = 3.0
	#Block reach increase for Ethereal Mining Charm.
	#以太采矿护符增加的方块触及距离。
	# Default: 4.0
	# Range: 0.0 ~ 32.0
	advancedMiningCharmReach = 4.0
	#Whether or not Dimensional Mirror should be capable of teleporting player across dimensions.
	#空间魔镜是否允许跨维度传送。设为 false 时，玩家必须身处目标维度才能传送过去。
	interdimensionalMirror = true

#音效（原版无此配置，为本模组新增）
[sound]
	#Global volume multiplier applied to every Forgotten Relics sound effect.
	#本模组所有音效的音量倍率。原版音量偏大，1.6.2 玩家实测仍嫌响，默认降到 40%；
	#设为 1.0 即恢复原版音量。注意：真实响度 = clamp(原始音量,0,1) * 本倍率 * 玩家音量滑条。
	# Default: 0.4
	# Range: 0.0 ~ 1.0
	soundVolumeMultiplier = 0.4

#Vis 储量上限（原版分类 Vis）
[vis]
	#Max Vis charge for Runic Stone.
	#符文天象石的最大 Vis 储量。
	# Default: 100
	# Range: 0 ~ 32768
	weatherStoneMaxCharge = 100
	#Max Vis charge for Dimensional Mirror.
	#空间魔镜的最大 Vis 储量。
	# Default: 100
	# Range: 0 ~ 32768
	dimensionalMirrorMaxCharge = 100

#经验之书（原版分类 XP Tome）
[xp_tome]
	#Experience points transferred per tick by Tome of Experience.
	#经验之书每 tick 转移的经验点数。
	# Default: 5
	# Range: 1 ~ 32768
	xpTomeTransferRate = 5

#符文天象石（原版分类 Weather Stone）
[weather_stone]
	#Base Vis cost per cast for Runic Stone.
	#符文天象石每次施法的 Vis 基础消耗。
	# Default: 25
	# Range: 0 ~ 32768
	weatherStoneVisCost = 25
	#Vis cost multiplier for Runic Stone.
	#符文天象石的 Vis 消耗倍率。
	# Default: 1.0
	# Range: 0.0 ~ 1024.0
	weatherStoneVisMult = 1.0
	#Channel duration in ticks for Runic Stone.
	#符文天象石的引导时长（tick）。
	# Default: 60
	# Range: 1 ~ 32768
	weatherStoneChannelDuration = 60
	#Cooldown in ticks after using Runic Stone.
	#符文天象石使用后的冷却（tick）。
	# Default: 100
	# Range: 0 ~ 32768
	weatherStoneCooldown = 100

#空间魔镜（原版分类 Dimensional Mirror）
[dimensional_mirror]
	#Channel duration in ticks for Dimensional Mirror.
	#空间魔镜的引导时长（tick）。
	# Default: 80
	# Range: 1 ~ 32768
	dimensionalMirrorChannelDuration = 80

#日耀石（原版分类 Shiny Stone）
[shiny_stone]
	#Interval in ticks between stillness checks.
	#日耀石的静止判定间隔（tick）。
	# Default: 4
	# Range: 1 ~ 32768
	shinyStoneCheckrate = 4
	#Still-tick threshold for the second heal rate.
	#静止累计达到该值时进入第 2 档回血速度。
	# Default: 40
	# Range: 0 ~ 32768
	shinyStoneStillThreshold2 = 40
	#Still-tick threshold for the third heal rate.
	#静止累计达到该值时进入第 3 档回血速度。
	# Default: 80
	# Range: 0 ~ 32768
	shinyStoneStillThreshold3 = 80
	#Still-tick threshold for the fourth heal rate.
	#静止累计达到该值时进入第 4 档回血速度。
	# Default: 200
	# Range: 0 ~ 32768
	shinyStoneStillThreshold4 = 200
	#Increment added to the still counter on each successful check.
	#每次判定静止时，累计值的增量。
	# Default: 4
	# Range: 0 ~ 32768
	shinyStoneStillIncrement = 4
	#Health restored per heal tick.
	#每次回血回复的生命值。
	# Default: 1.0
	# Range: 0.0 ~ 32768.0
	shinyStoneHealAmount = 1.0

#湮灭之钥（第七波：合成栏绑定物品、背包按模式吞噬）
[oblivion_stone]
	#How many items a single Keystone of The Oblivion can bind before it refuses more.
	#单把湮灭之钥能绑定的物品条数上限，超过后合成栏不再接受新样本。原版配置 key 是 oblivionStoneHardCap，默认 64（用于防止超长清单带来性能问题）。
	# Default: 64
	# Range: 0 ~ 2048
	oblivionStoneHardCap = 64
	#How many entries the Ctrl tooltip lists before it switches to a random sample.
	#Ctrl 清单全量展开的条数上限，超过后只随机显示这么多条（避免清单长到看不清）。原版配置 key 是 oblivionStoneSoftCap，默认 28。
	# Default: 28
	# Range: 0 ~ 2048
	oblivionStoneSoftCap = 28
	#Warp granted by the Keystone of The Oblivion. Original getWarp returns 2.
	#湮灭之钥附带的扭曲值。原版 ItemOblivionStone#getWarp 返回 2。
	# Default: 2
	# Range: 0 ~ 32768
	oblivionStoneWarp = 2

#叠加之戒（原版分类 Superposition Ring）
[superposition_ring]
	#Chance per check for Ring of Superposition to swap positions.
	#叠加之戒每次判定时的位置交换概率。
	# Default: 0.025
	# Range: 0.0 ~ 1.0
	superpositionRingSwapChance = 0.025
	#Check interval in ticks for Ring of Superposition.
	#叠加之戒的交换判定间隔（tick）。
	# Default: 600
	# Range: 1 ~ 32768
	superpositionRingCheckInterval = 600
	#Lower bound of the fraction of incoming damage split among other wearers.
	#受到伤害时，分摊给其他佩戴者的比例下限。原版是 0.12。
	# Default: 0.12
	# Range: 0.0 ~ 1.0
	superpositionRingSplitMin = 0.12
	#Upper bound of the fraction of incoming damage split among other wearers.
	#分摊比例的上限。原版是 0.74（即 0.12 + 随机 0.62）。
	# Default: 0.74
	# Range: 0.0 ~ 1.0
	superpositionRingSplitMax = 0.74

#远古之庇护（原版分类 Generic Config / Ancient Aegis）
[ancient_aegis]
	#Damage reduction for Ancient Aegis. 1.0 equals 100% reduction.
	#远古之庇护为佩戴者提供的伤害减免比例。0.25 表示 25%。
	# Default: 0.25
	# Range: 0.0 ~ 1.0
	ancientAegisDamageReduction = 0.25
	#Heal amount per interval for Ancient Aegis.
	#远古之庇护每次治疗回复的生命值。
	# Default: 1.0
	# Range: 0.0 ~ 32768.0
	ancientAegisHealAmount = 1.0
	#Heal interval in ticks for Ancient Aegis.
	#远古之庇护的治疗判定间隔（tick）。
	# Default: 20
	# Range: 1 ~ 32768
	ancientAegisHealInterval = 20
	#Knockback resistance granted by Ancient Aegis.
	#远古之庇护提供的击退抗性。1.0 表示完全免疫击退。
	# Default: 1.0
	# Range: 0.0 ~ 1.0
	ancientAegisKnockbackResistance = 1.0

#七阳之戒（原版分类 Generic Config / Dark Sun Ring）
[dark_sun_ring]
	#Damage cap for Ring of The Seven Suns. Attacks exceeding this are negated.
	#七阳之戒的伤害上限。超过该数值的攻击会被完全抵消。
	# Default: 100.0
	# Range: 0.0 ~ 32768.0
	darkSunRingDamageCap = 100.0
	#Chance to deflect an attack back to its source.
	#把攻击反弹给攻击者的概率。
	# Default: 0.2
	# Range: 0.0 ~ 1.0
	darkSunRingDeflectChance = 0.2
	#Enables a cooldown on the fire-damage-to-healing conversion.
	#是否给「火焰伤害转化为治疗」加上冷却限制，避免站在火里瞬间回满血。
	darkSunRingHealLimit = false
	#Max Vis charge for Ring of The Seven Suns.
	#七阳之戒的最大 Vis 储量。
	# Default: 500
	# Range: 0 ~ 32768
	darkSunRingMaxCharge = 500

#神圣护身符（原版分类 Deific Amulet）
[deific_amulet]
	#Whether Deific Amulet grants immunity to status effects.
	#神圣护身符是否免疫状态效果。
	deificAmuletEffectImmunity = true
	#When true, only debuffs are removed and buffs are kept.
	#开启后只清除减益效果，保留增益效果。
	deificAmuletOnlyNegatesDebuffs = false
	#Whether Deific Amulet extends invincibility frames.
	#神圣护身符是否延长无敌帧。
	deificAmuletInvincibility = true
	#Invincibility frame extension in ticks.
	#延长后的无敌帧时长（tick）。
	# Default: 40
	# Range: 0 ~ 32768
	deificAmuletInvincibilityExtension = 40
	#Cooldown in ticks for the invincibility frame extension.
	#无敌帧延长效果的冷却（tick）。
	# Default: 32
	# Range: 0 ~ 32768
	deificAmuletInvincibilityCooldown = 32
	#Air supply in ticks restored when the wearer is suffocating.
	#佩戴者窒息时补充的氧气量（tick），原版换算自 deificAmuletFireDuration。
	# Default: 300
	# Range: 0 ~ 32768
	deificAmuletAirSupply = 300
	#Base Vis cost for Deific Amulet suffocation prevention.
	#神圣护身符补充氧气的 Vis 基础消耗。
	# Default: 10
	# Range: 0 ~ 32768
	deificAmuletFireVisCost = 10
	#Vis cost multiplier for Deific Amulet.
	#神圣护身符的 Vis 消耗倍率。
	# Default: 1.0
	# Range: 0.0 ~ 1024.0
	deificAmuletVisCost = 1.0
	#Max Vis charge for Deific Amulet.
	#神圣护身符的最大 Vis 储量。
	# Default: 200
	# Range: 0 ~ 32768
	deificAmuletMaxCharge = 200

#湮灭护符（原版分类 Oblivion Amulet）
[oblivion_amulet]
	#Chance per tick to release stored damage.
	#湮灭护符每 tick 释放已储存伤害的概率。
	# Default: 8.0E-4
	# Range: 0.0 ~ 1.0
	oblivionAmuletDamageReleaseChance = 8.0E-4
	#Upper bound for a single damage release.
	#单次释放伤害的上限。
	# Default: 100.0
	# Range: 0.0 ~ 32768.0
	oblivionAmuletDamageCap = 100.0
	#Chance to clamp an over-cap release to a random value below the cap.
	#释放伤害超过上限时，改为按上限随机取值的概率。
	# Default: 0.9
	# Range: 0.0 ~ 1.0
	oblivionAmuletHighDamageReductionChance = 0.9
	#Chance per tick to apply a random debuff.
	#湮灭护符每 tick 施加随机负面效果的概率。
	# Default: 4.0E-4
