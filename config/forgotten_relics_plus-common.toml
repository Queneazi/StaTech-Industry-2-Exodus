#食尸鬼之颅（原创补完物品：1.7.10 原版只有未写完的骨架）
[ghastly_skull]
	#Minimum health required to sacrifice. Below this the skull refuses to fire.
	#允许献祭所需的最低生命值，低于此值则拒绝发动（避免变成自杀）。
