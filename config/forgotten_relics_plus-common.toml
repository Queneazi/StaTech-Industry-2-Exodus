#混沌之核（第四波：核心类）
[chaos_core]
	#Chance per tick to apply a random potion effect while carried.
	#随身携带时，每 tick 施加随机状态效果的概率。原版写死 2.08E-4。
	# Default: 2.08E-4
	# Range: 0.0 ~ 1.0
	chaosCoreChance = 2.08E-4
	#Minimum effect duration in ticks.
	#状态效果的最短持续时间（tick）。原版是 100。
	# Default: 100
	# Range: 0 ~ 32768
	chaosCoreDurationMin = 100
	#Random span added on top of the minimum duration, in ticks.
	#在最短持续时间之上再随机叠加的区间长度（tick）。原版是 2400。
	# Default: 2400
	# Range: 0 ~ 32768
	chaosCoreDurationSpan = 2400
	#Highest amplifier that can be rolled (0 means level I).
	#能随机到的最高等级（0 即 I 级）。原版是 0~2。
	# Default: 2
	# Range: 0 ~ 255
	chaosCoreMaxAmplifier = 2
	#Warp granted by the Chaos Core.
	#混沌之核附带的扭曲值。原版是 2。
	# Default: 2
	# Range: 0 ~ 32768
	chaosCoreWarp = 2
	#Chance to redirect damage when the carrier is the attacker.
	#携带者是攻击者时，把伤害转嫁给 16 格内随机实体的概率。原版是 0.45。
	# Default: 0.45
	# Range: 0.0 ~ 1.0
	chaosCoreRedirectAttack = 0.45
	#Chance to redirect damage when the carrier is the victim.
	#携带者是受害者时，把伤害转嫁给 16 格内随机实体的概率。原版是 0.42。
	# Default: 0.42
	# Range: 0.0 ~ 1.0
	chaosCoreRedirectDefend = 0.42
	#Chance for the redirected damage to bounce back onto the attacker instead.
	#转嫁时改为反弹给攻击者自己的概率。原版是 0.15。
	# Default: 0.15
	# Range: 0.0 ~ 1.0
	chaosCoreSelfReflect = 0.15
	#Upper bound of the random multiplier applied to redirected damage and incoming damage.
	#转嫁量与「受到的伤害随机系数」的上限倍率。原版写死 2.0（即 0~2 倍）。
	# Default: 2.0
	# Range: 0.0 ~ 1024.0
	chaosCoreDamageMultMax = 2.0

#欧米伽之核（第四波：原版无配方与研究的创造模式物品）
[omega_core]
	#Enable Omega Core research and crafting when Re:Avaritia is installed. Restart required.
	#是否启用欧米伽之核研究与合成；仍需安装 Re:Avaritia。修改后需重启游戏或服务器。
	enabled = true
	#Vis added to each primal aspect of each wand per tick while carried.
	#随身携带时，每 tick 给法杖的每个原初要素补充的 Vis。原版是 1。
	# Default: 1
	# Range: 0 ~ 32768
	omegaCoreVisPerTick = 1
	#Charge added per tick to every Forgotten Relics rechargeable item the carrier holds.
	#随身携带时，每 tick 给身上每件遗物（物品自身充能）补充的点数。1.21.1 没有玩家 Vis 池，遗物的 Vis 存在物品充能里，所以欧米伽之核必须同时给它们充能；0 表示关闭这一支（只补法杖）。
	# Default: 1
	# Range: 0 ~ 32768
	omegaCoreRechargePerTick = 1
	#Protect the carrier from lethal health writes, death methods and destructive entity removal.
	#携带欧米伽之核时是否免疫致死改血量（含 setHealth）、死亡调用及致死实体移除，生命最低为 1。
	omegaCorePreventDeath = true

