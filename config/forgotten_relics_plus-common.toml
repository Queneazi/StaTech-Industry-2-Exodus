	#Maximum duration of the random debuff.
	#随机负面效果的最长持续时间（tick）。
	# Default: 2100
	# Range: 0 ~ 32768
	oblivionAmuletPotionDurationMax = 2100
	#Minimum amplifier of the random debuff.
	#随机负面效果的最低等级（0 表示 I 级）。
	# Default: 0
	# Range: 0 ~ 255
	oblivionAmuletPotionLevelMin = 0
	#Maximum amplifier of the random debuff.
	#随机负面效果的最高等级。
	# Default: 3
	# Range: 0 ~ 255
	oblivionAmuletPotionLevelMax = 3
	#Warp granted by Amulet of The Oblivion.
	#湮灭护符附带的扭曲值。
	# Default: 4
	# Range: 0 ~ 32768
	oblivionAmuletWarp = 4
	#Vis cost multiplier for Amulet of The Oblivion.
	#湮灭护符储存伤害的 Vis 消耗倍率。
	# Default: 1.0
	# Range: 0.0 ~ 1024.0
	oblivionAmuletVisCost = 1.0
	#Max Vis charge for Amulet of The Oblivion.
	#湮灭护符的最大 Vis 储量。
	# Default: 400
	# Range: 0 ~ 32768
	oblivionAmuletMaxCharge = 400

